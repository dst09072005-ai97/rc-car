<!-- ============================================================================ -->
<!-- [OPTIMIZED UI MASTER V260] LIQUID GEAR WIDGET & MOBILE OPTIMIZATION         -->
<!-- ============================================================================ -->
<style id="v260-master-ui-styles">
  /* 1. Bố cục Minimap góc trên trái & Nút Bánh Răng Liquid Widget ngay bên dưới */
  #circular-minimap-widget {
    top: 14px !important;
    left: 14px !important;
    bottom: auto !important;
    z-index: 950 !important;
  }
  #minimap-legend {
    display: none !important;
  }

  #liquid-gear-widget-container {
    position: fixed;
    top: 196px;
    left: 14px;
    z-index: 960;
    width: 248px;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    user-select: none;
    pointer-events: none;
  }

  #liquid-gear-trigger-btn {
    pointer-events: auto;
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 9px 14px;
    border-radius: 24px;
    border: 1px solid rgba(0, 229, 255, 0.55);
    background: linear-gradient(135deg, rgba(10, 18, 34, 0.92), rgba(20, 36, 62, 0.88));
    color: #00f5d4;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.55), inset 0 1px 1px rgba(255, 255, 255, 0.18);
    transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.25s ease, box-shadow 0.25s ease;
  }
  #liquid-gear-trigger-btn:hover {
    border-color: #00f5d4;
    box-shadow: 0 10px 28px rgba(0, 245, 212, 0.28);
    transform: translateY(-1px);
  }
  #liquid-gear-trigger-btn .gear-icon {
    display: inline-block;
    font-size: 16px;
    transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
  }
  #liquid-gear-trigger-btn.liquid-open .gear-icon {
    transform: rotate(180deg);
  }

  /* Danh sách cuộn Liquid Glass */
  #liquid-gear-menu-list {
    pointer-events: auto;
    margin-top: 8px;
    max-height: 0;
    opacity: 0;
    overflow-y: hidden;
    border-radius: 18px;
    background: rgba(9, 15, 28, 0.94);
    border: 1px solid rgba(0, 229, 255, 0.0);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 14px 34px rgba(0, 0, 0, 0.65);
    transition:
      max-height 0.38s cubic-bezier(0.22, 1, 0.36, 1),
      opacity 0.28s ease,
      padding 0.28s ease,
      border-color 0.28s ease;
    padding: 0 8px;
  }
  #liquid-gear-menu-list.liquid-expanded {
    max-height: 58vh;
    opacity: 1;
    overflow-y: auto;
    padding: 8px;
    border-color: rgba(0, 229, 255, 0.42);
  }
  #liquid-gear-menu-list::-webkit-scrollbar {
    width: 5px;
  }
  #liquid-gear-menu-list::-webkit-scrollbar-thumb {
    background: rgba(0, 229, 255, 0.4);
    border-radius: 4px;
  }

  .liquid-item-btn {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 7px 10px;
    margin-bottom: 5px;
    border-radius: 11px;
    border: 1px solid rgba(255, 255, 255, 0.09);
    background: rgba(22, 32, 52, 0.78);
    color: #e2e8f0;
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    text-align: left;
    transition: all 0.18s ease;
  }
  .liquid-item-btn:last-child {
    margin-bottom: 0;
  }
  .liquid-item-btn:hover {
    background: rgba(34, 52, 84, 0.92);
    border-color: rgba(0, 229, 255, 0.5);
    transform: translateX(2px);
  }
  .liquid-item-btn.active-true {
    background: linear-gradient(90deg, rgba(6, 214, 160, 0.25), rgba(0, 187, 249, 0.22));
    border-color: #06d6a0;
    color: #ffffff;
  }
  .liquid-badge {
    font-size: 10px;
    font-weight: 800;
    padding: 2px 7px;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.12);
    color: #ffd166;
    flex-shrink: 0;
  }
  .liquid-item-btn.active-true .liquid-badge {
    background: #06d6a0;
    color: #041019;
  }

  /* 2. Tối ưu không gian bản Mobile (Thu gọn panel cồng kềnh) */
  @media (max-width: 768px) {
    #liquid-gear-widget-container {
      top: 175px;
      left: 10px;
      width: 215px;
    }
    #liquid-gear-trigger-btn {
      padding: 7px 10px;
      font-size: 11.5px;
    }
    .mobile-compact-hidden {
      display: none !important;
    }
  }

  /* 5. Role Seat Badge hiển thị vai trò thời gian thực */
  #v260-role-seat-badge {
    position: fixed;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 980;
    padding: 7px 18px;
    border-radius: 20px;
    font-size: 13.5px;
    font-weight: 700;
    letter-spacing: 0.5px;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    transition: all 0.3s ease;
    pointer-events: none;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45);
    user-select: none;
  }
  .role-driver {
    background: rgba(0, 35, 20, 0.88);
    border: 1.5px solid #00ff88;
    color: #00ff88;
    text-shadow: 0 0 8px rgba(0, 255, 136, 0.5);
  }
  .role-passenger {
    background: rgba(10, 25, 45, 0.88);
    border: 1.5px solid #00d2ff;
    color: #00d2ff;
    text-shadow: 0 0 8px rgba(0, 210, 255, 0.5);
  }
  .role-foot {
    background: rgba(35, 30, 10, 0.88);
    border: 1.5px solid #ffd60a;
    color: #ffd60a;
    text-shadow: 0 0 8px rgba(255, 214, 10, 0.5);
  }
  @media (max-width: 768px) {
    #v260-role-seat-badge {
      font-size: 11px;
      padding: 5px 12px;
      top: 10px;
      max-width: 90vw;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  }

</style>
